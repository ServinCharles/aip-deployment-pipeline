# sit-01 frontend: aip-webapp in namespace sit-01-dip, calling aip-api and aip-chat-api in sit-01-api
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sit-01-dip
resources:
  - namespace.yaml
  - ../../../base/aip-webapp
replicas:
  - name: aip-webapp
    count: 1
labels:
  - pairs:
      environment: sit-01
patches:
  - target:
      kind: Deployment
      name: aip-webapp
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: http://aip-api.sit-01-api.svc.cluster.local:8080
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: http://aip-chat-api.sit-01-api.svc.cluster.local:8080
