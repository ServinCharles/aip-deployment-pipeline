# sit-01 data services: MongoDB and Kafka in namespace sit-01-data (deployed by scripts/deploy-data.sh)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sit-01-data
resources:
  - namespace.yaml
  - network-policy.yaml
  - ../../../base/mongodb
  - ../../../base/kafka
labels:
  - pairs:
      environment: sit-01
