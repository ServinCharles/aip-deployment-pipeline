# Only this environment's backend namespace (sit-01-api) can reach MongoDB and Kafka.
# Pods inside sit-01-data can still talk to each other.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sit-01-api-only
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sit-01-api
        - podSelector: {}
