# .NET Agreement in Principle API (internal only, ClusterIP)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aip-api
  labels:
    app: aip-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aip-api
  template:
    metadata:
      labels:
        app: aip-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aip-api
          image: aip-api # pinned to a build-pipeline image by scripts/deploy.sh
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            # Workstation GC: one small heap instead of one per CPU core (server GC), which used far more memory
            - name: DOTNET_gcServer
              value: "0"
            # One JSON object per log line, so Grafana (Loki) can filter on fields such as ApplicationId and Decision
            - name: Logging__Console__FormatterName
              value: json
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            # 512Mi: the Kafka client (librdkafka) and MongoDB driver use native memory outside the .NET heap;
            # at 256Mi the pod was OOMKilled under load
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: aip-api
  labels:
    app: aip-api
spec:
  type: ClusterIP
  selector:
    app: aip-api
  ports:
    - name: http
      port: 8080
      targetPort: http
