name: CI failure triage

# When the CI workflow fails:
#   - on a pull request: comments the failing job, step and errors on that PR,
#     labels it "ci-failure" and requests a review from the repo owner
#   - on a branch with no pull request (e.g. main): opens or updates a "ci-failure" issue
#
# What it can and can't do:
#   CAN    read CI results, comment, label, open issues, request a human review
#   CAN'T  push code, approve or merge pull requests (contents: read)
# Pushing fixes, approving and merging are always done by a human.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read        # no push, so no merge
  issues: write         # issues and labels
  pull-requests: write  # comment on PRs and request reviews (not approve or merge)

jobs:
  triage:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Report the failure and ask for a human review
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const reviewer = owner; // the human who reviews, pushes fixes and merges

            // Which jobs and steps failed, with their error annotations
            const jobs = (await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: run.id })).data.jobs;
            const failed = jobs.filter(j => j.conclusion === 'failure');

            let details = '';
            for (const job of failed) {
              const steps = (job.steps || []).filter(s => s.conclusion === 'failure').map(s => s.name);
              details += `### ${job.name}\nFailed step: ${steps.join(', ') || 'unknown'}\n`;
              const notes = (await github.rest.checks.listAnnotations({ owner, repo, check_run_id: job.id })).data
                .filter(a => a.annotation_level === 'failure').slice(0, 10);
              for (const a of notes) details += `- ${a.message}\n`;
              details += '\n';
            }

            const body = [
              `❌ CI run [#${run.run_number}](${run.html_url}) failed on \`${run.head_branch}\` (commit ${run.head_sha.slice(0, 7)}).`,
              '',
              details,
              `**To fix:** find the cause from the errors above, push a fix to this branch (or open a pull request for it) and make CI green.`,
              '',
              `**Human review required:** @${reviewer} reviews and approves the change, and merges it. This workflow never pushes or merges.`
            ].join('\n');

            const pr = (run.pull_requests || [])[0];
            if (pr) {
              // Failure on a pull request: report it there and ask for a review
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['ci-failure'] });
              const author = (await github.rest.pulls.get({ owner, repo, pull_number: pr.number })).data.user.login;
              if (author !== reviewer) {
                // GitHub doesn't allow requesting a review from the PR's own author
                await github.rest.pulls.requestReviewers({ owner, repo, pull_number: pr.number, reviewers: [reviewer] });
              }
              return;
            }

            // Failure with no pull request (e.g. on main): one open issue per branch
            const title = `CI failed: ${failed.map(j => j.name).join(', ') || 'CI'} on ${run.head_branch}`;
            const existing = (await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'ci-failure' })).data
              .find(i => i.title.endsWith(`on ${run.head_branch}`));
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['ci-failure'], assignees: [reviewer] });
            }
