name: CI

# Proves the deploy pipeline on a real Kubernetes cluster (kind), using the same scripts and the
# same containerised kubectl that Jenkins uses.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  KUBECTL_IMAGE: registry.k8s.io/kubectl:v1.35.0

jobs:
  validate:
    name: Terraform and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt and validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - name: Render every environment
        run: |
          for dir in k8s/environments/*/*/; do
            echo "== $dir"
            kubectl kustomize "$dir" > /dev/null
          done
      - name: Shell scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done

  monitoring:
    name: Monitoring chart and dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Render the Grafana Kubernetes Monitoring chart with our values
        run: |
          if ! ./scripts/monitoring-setup.sh preview > rendered.yaml 2> render-errors.txt; then
            tail -n 20 render-errors.txt | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          echo "Rendered $(grep -c '^kind:' rendered.yaml) objects"
          grep '^kind:' rendered.yaml | sort | uniq -c
          grep -q 'grafana-cloud' rendered.yaml || { echo "::error::the grafana-cloud secret is not referenced"; exit 1; }
          grep -qi 'beyla' rendered.yaml || { echo "::error::Beyla is not in the rendered chart"; exit 1; }
      - name: Dashboard JSON matches build-dashboard.py
        run: |
          python3 monitoring/dashboards/build-dashboard.py
          git diff --stat --exit-code monitoring/dashboards/ || { echo "::error::dashboard JSON out of date: $(git diff --stat monitoring/dashboards/ | tail -1)"; exit 1; }

  deploy:
    name: Deploy to sit-01 and sit-02 on kind
    runs-on: ubuntu-latest
    env:
      KUBECTL: ${{ github.workspace }}/scripts/kubectl-docker.sh
      KUBECONFIG_FILE: /home/runner/.kube/config
    steps:
      - uses: actions/checkout@v4

      - name: Check out aip-mortgage-api
        uses: actions/checkout@v4
        with:
          repository: ServinCharles/aip-mortgage-api
          path: apps/aip-mortgage-api
      - name: Check out aip-webapp
        uses: actions/checkout@v4
        with:
          repository: ServinCharles/aip-webapp
          path: apps/aip-webapp
      - name: Check out aip-chat-api (once that repo exists)
        id: chat
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ServinCharles/aip-chat-api
          path: apps/aip-chat-api
      - name: Check out aip-audit-service (once that repo exists)
        id: audit
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ServinCharles/aip-audit-service
          path: apps/aip-audit-service
      - name: Does this aip-api version save applications?
        id: persistence
        run: |
          if grep -q PERSISTENCE_ENABLED apps/aip-mortgage-api/src/AipApi/PersistenceOptions.cs 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::aip-api main doesn't have applicationId/persistence yet, so the persistence checks are skipped"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Build images and load them into the cluster
        run: |
          docker build -t aip-api:ci apps/aip-mortgage-api
          docker build -t aip-webapp:ci apps/aip-webapp
          kind load docker-image aip-api:ci aip-webapp:ci --name chart-testing

      - name: Build and deploy aip-chat-api to sit-01
        if: steps.chat.outcome == 'success'
        run: |
          docker build -t aip-chat-api:ci apps/aip-chat-api
          kind load docker-image aip-chat-api:ci --name chart-testing
          ./scripts/deploy.sh aip-chat-api sit-01 aip-chat-api:ci

      - name: Deploy sit-01 data services (MongoDB + Kafka)
        run: ./scripts/deploy-data.sh sit-01

      - name: Deploy sit-01 (api, then webapp)
        run: |
          ./scripts/deploy.sh aip-api sit-01 aip-api:ci
          ./scripts/deploy.sh aip-webapp sit-01 aip-webapp:ci

      - name: sit-01 saves applications (persistence on)
        if: steps.persistence.outputs.enabled == 'true'
        run: |
          "$KUBECTL" -n sit-01-api run persist-check --rm -i --restart=Never --quiet \
            --image=curlimages/curl:8.11.1 --command -- sh -c '
              set -e
              id=$(curl -sSf -X POST http://aip-api:8080/api/mortgages/dip/decision -H "Content-Type: application/json" \
                -d "{\"annualIncome\":45000,\"loanAmount\":150000}" | sed -n "s/.*\"applicationId\":\"\([^\"]*\)\".*/\1/p")
              echo "applicationId: $id"
              [ -n "$id" ]
              curl -sSf "http://aip-api:8080/api/applications/$id" | tee /dev/stderr | grep -q "\"decision\":\"Accepted\""
              echo " saved in MongoDB"'

      - name: Build and deploy aip-audit-service to sit-01, then check a decision is audited
        if: steps.audit.outcome == 'success' && steps.persistence.outputs.enabled == 'true'
        run: |
          docker build -t aip-audit-service:ci apps/aip-audit-service
          kind load docker-image aip-audit-service:ci --name chart-testing
          ./scripts/deploy.sh aip-audit-service sit-01 aip-audit-service:ci
          "$KUBECTL" -n sit-01-api run audit-check --rm -i --restart=Never --quiet \
            --image=curlimages/curl:8.11.1 --command -- sh -c '
              set -e
              id=$(curl -sSf -X POST http://aip-api:8080/api/mortgages/dip/decision -H "Content-Type: application/json" \
                -d "{\"annualIncome\":30000,\"loanAmount\":200000}" | sed -n "s/.*\"applicationId\":\"\([^\"]*\)\".*/\1/p")
              echo "applicationId: $id"
              for i in $(seq 1 30); do
                body=$(curl -sSf "http://aip-audit-service:8080/api/audit/$id")
                echo "$body" | grep -q "AipDecisionMade" && { echo "$body"; echo " audited"; exit 0; }
                sleep 1
              done
              echo "event not audited within 30s: $body"; exit 1'

      - name: Deploy sit-02 (api, then webapp)
        run: |
          ./scripts/deploy.sh aip-api sit-02 aip-api:ci
          ./scripts/deploy.sh aip-webapp sit-02 aip-webapp:ci

      - name: A broken image rolls back automatically
        run: |
          if ROLLOUT_TIMEOUT=45s ./scripts/deploy.sh aip-api sit-01 aip-api:does-not-exist; then
            echo "::error::Deploying a missing image should have failed"; exit 1
          fi
          running="$("$KUBECTL" -n sit-01-api get deploy aip-api -o jsonpath='{.spec.template.spec.containers[0].image}')"
          echo "sit-01 is running: $running"
          test "$running" = "aip-api:ci"
          "$KUBECTL" -n sit-01-api rollout status deploy/aip-api --timeout=60s

      - name: Show what is running
        if: always()
        run: kubectl get pods,svc -A -l app.kubernetes.io/part-of=aip-mortgage -o wide
